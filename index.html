<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mandate — institutional time & presence auditing engine. Investor click-through prototype." />
    <meta name="theme-color" id="theme-color-meta" content="#09090b" />
    <title>Mandate — Investor Prototype</title>
    <script>
      // Set the theme class before React mounts so there's no flash of the
      // wrong theme. Dark is the product default; a stored preference wins.
      (function () {
        try {
          var stored = localStorage.getItem('mandate-theme');
          var theme = stored === 'light' ? 'light' : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
